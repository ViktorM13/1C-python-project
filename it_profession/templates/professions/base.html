<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="bg-primary text-white py-3">
        <div class="container-fluid">
            <h1 class="h3 mb-0">1C</h1>
        </div>
    </header>
    <div class="container-fluid flex-grow-1">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-none d-md-block bg-light sidebar">
                <div class="sidebar-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="{% url 'professions:index' %}">Главная</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'professions:general_stats' %}">Общая статистика</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'professions:demand' %}">Востребованность</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'professions:geography' %}">География</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'professions:skills' %}">Навыки</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'professions:latest_jobs' %}">Последние вакансии</a></li>
                    </ul>
                </div>
            </nav>
            <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-4 py-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            Малкеров Виктор Евгеньевич, РИ-231003
        </div>
    </footer>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
